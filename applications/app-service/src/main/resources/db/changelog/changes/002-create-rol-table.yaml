databaseChangeLog:
  - changeSet:
      id: 2
      author: Juan Angarita
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)

        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  valueNumeric: 1
              - column:
                  name: name
                  value: USER
              - column:
                  name: description
                  value: Normal user

        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  valueNumeric: 2
              - column:
                  name: name
                  value: ADMIN
              - column:
                  name: description
                  value: Administrator user

        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  valueNumeric: 3
              - column:
                  name: name
                  value: ADVISER
              - column:
                  name: description
                  value: Adviser user

  - changeSet:
      id: 3
      author: Juan Angarita
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: document_number
                  type: VARCHAR(20)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_users_roles

        - update:
            tableName: users
            columns:
              - column:
                  name: role_id
                  valueNumeric: 1
            where: role_id IS NULL